<!-- ============================================================
     CUTIE CARE — MORS DAG POPUP (bild + köp-presentkort-knapp)
     Injiceras före </body> i index.html. Visas en gång per besökare
     (1.6s fördröjning), stängs med X / Esc / klick utanför, och döljs
     automatiskt efter 2026-05-31.
     ============================================================ -->
<div id="cc-morsdag" class="ccmd" role="dialog" aria-modal="true" aria-label="Mors dag — köp presentkort">
  <div class="ccmd__overlay" data-ccmd-close></div>
  <div class="ccmd__card" role="document">
    <button class="ccmd__close" aria-label="Stäng" data-ccmd-close>&times;</button>
    <a class="ccmd__img-link" href="https://shop.cutiecare.se/product/presentkort/" data-ccmd-cta>
      <img src="img/morsdag-popup.jpg" alt="Skäm bort mamma på Mors dag — ge henne ett presentkort till Cutie Care" />
    </a>
    <a class="ccmd__cta" href="https://shop.cutiecare.se/product/presentkort/" data-ccmd-cta>Köp presentkort</a>
  </div>
</div>

<style>
  #cc-morsdag{
    --red-dark:#8B1525;--dark:#2A1C14;
    position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;
    padding:20px;font-family:'Inter',system-ui,sans-serif;
  }
  #cc-morsdag.is-open{display:flex;}
  .ccmd__overlay{position:absolute;inset:0;background:rgba(42,28,20,.6);backdrop-filter:blur(3px);
    opacity:0;transition:opacity .35s ease;}
  #cc-morsdag.is-open .ccmd__overlay{opacity:1;}
  .ccmd__card{position:relative;width:min(400px,100%);max-height:94vh;display:flex;flex-direction:column;
    border-radius:8px;overflow:hidden;box-shadow:0 40px 90px rgba(42,28,20,.5);
    transform:translateY(18px) scale(.98);opacity:0;
    transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s ease;}
  #cc-morsdag.is-open .ccmd__card{transform:none;opacity:1;}
  .ccmd__close{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border:none;cursor:pointer;
    background:rgba(255,255,255,.92);border-radius:50%;color:#2A1C14;font-size:24px;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(42,28,20,.25);}
  .ccmd__close:hover{background:#fff;}
  .ccmd__img-link{display:block;flex:1 1 auto;min-height:0;background:#F5EDE3;}
  .ccmd__img-link img{display:block;width:100%;height:100%;object-fit:cover;}
  .ccmd__cta{flex:0 0 auto;display:block;text-align:center;background:var(--red-dark);color:#fff;
    text-decoration:none;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:16px;
    padding:20px 16px;transition:background .2s ease;}
  .ccmd__cta:hover{background:#6f0f1d;}
  @media(max-height:760px){.ccmd__card{width:min(340px,100%);}.ccmd__cta{padding:16px;font-size:15px;}}
</style>

<script>
(function(){
  // Visas vid VARJE sidladdning/uppdatering (ingen once-per-besökare-spärr). Döljs efter mors dag.
  var DEADLINE=new Date('2026-06-01T00:00:00+02:00');
  if(new Date()>=DEADLINE) return;
  var el=document.getElementById('cc-morsdag');
  if(!el) return;
  function open(){el.classList.add('is-open');}
  function close(){el.classList.remove('is-open');}
  el.querySelectorAll('[data-ccmd-close]').forEach(function(b){b.addEventListener('click',close);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  setTimeout(open,1600);
})();
</script>
